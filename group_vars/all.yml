---
# Shared defaults. Override with -e, host_vars or an ansible-vault file.

# Docker network every service joins (created by nginx.yml / the services).
network: dmz_network
timezone: Europe/Paris

# Where generated Dockerfiles / configs live on the host.
data_dir: /data

# Published ports of internal services are bound here. Docker bypasses
# ufw/nftables for published ports, so keep 127.0.0.1 unless you really want
# a service reachable from the internet. nginx reaches containers over the
# docker network and does not need host ports.
bind_address: 127.0.0.1

# Images always follow the newest tag: every playbook run pulls it and recreates the
# container when it changed (see docker-playbooks/includes/deploy_container.yml, which also
# health-checks the new container and rolls back to the previous image on failure).
# To freeze a service, replace :latest with a version tag.
# node uses "lts" (not "latest": the newest Node is an odd, non-LTS release).
nginx_image: "nginx:latest"
mongo_image: "mongo:latest"
neko_image: "ghcr.io/m1k1o/neko/firefox:latest"
code_server_image: "linuxserver/code-server:latest"
json_server_node_image: "node:lts-alpine"

# Remove dangling (superseded) images after a successful update. Note this prunes
# every dangling image on the host, not only the ones of these services.
prune_old_images: false

# Host path of the nginx named volume (used to drop vhost files / certificates).
nginx_volume: nginx_data
nginx_volume_path: "/var/lib/docker/volumes/{{ nginx_volume }}/_data"
