---
- name: Deploy eva
  hosts: docker_hosts
  gather_facts: true
  become: true
  vars:
    eva_dir: "{{ data_dir }}/eva/docker"
    eva_ref: main
    eva_local_image: mvs/eva
    eva_host_port: 4210

  tasks:
    - name: Create docker network
      community.docker.docker_network:
        name: "{{ network }}"

    - name: Create eva build folder
      ansible.builtin.file:
        path: "{{ eva_dir }}"
        state: directory
        mode: "0755"

    - name: Write Dockerfile
      ansible.builtin.template:
        src: eva.Dockerfile.j2
        dest: "{{ eva_dir }}/Dockerfile"
        mode: "0644"

    - name: Build image
      community.docker.docker_image_build:
        name: "{{ eva_local_image }}"
        path: "{{ eva_dir }}"
        rebuild: always
        pull: true
        # Set eva_ref to a tag/commit for reproducible builds; with "main" bust the cache.
        nocache: "{{ eva_ref == 'main' }}"

    - name: Run eva container
      community.docker.docker_container:
        name: eva
        image: "{{ eva_local_image }}"
        pull: never
        hostname: eva_host
        state: started
        restart_policy: unless-stopped
        published_ports:
          - "{{ bind_address }}:{{ eva_host_port }}:4200"
        networks:
          - name: "{{ network }}"
        security_opts:
          - no-new-privileges:true
        cap_drop: [ALL]
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"
