---
- name: Deploy eva
  hosts: docker_hosts
  gather_facts: true
  become: true
  vars:
    eva_dir: "{{ data_dir }}/eva/docker"
    eva_ref: main
    eva_local_image: mvs/eva
    eva_host_port: 4210

  tasks:
    - name: Create docker network
      community.docker.docker_network:
        name: "{{ network }}"

    - name: Create eva build folder
      ansible.builtin.file:
        path: "{{ eva_dir }}"
        state: directory
        mode: "0755"

    - name: Write Dockerfile
      ansible.builtin.template:
        src: eva.Dockerfile.j2
        dest: "{{ eva_dir }}/Dockerfile"
        mode: "0644"

    # Base image is pulled on every build; CACHEBUST (today's date) refreshes the Angular CLI
    # and the eva sources at most once a day, so an unchanged day does not recreate the container.
    - name: Build image on the latest base
      community.docker.docker_image_build:
        name: "{{ eva_local_image }}"
        path: "{{ eva_dir }}"
        rebuild: always
        pull: true
        args:
          CACHEBUST: "{{ ansible_facts['date_time']['date'] }}"

    - name: Run the freshly built eva image
      ansible.builtin.include_tasks: includes/deploy_container.yml
      vars:
        svc_name: eva
        svc_image: "{{ eva_local_image }}"
        svc_pull: never
        svc_params:
          hostname: eva_host
          restart_policy: unless-stopped
          published_ports:
            - "{{ bind_address }}:{{ eva_host_port }}:4200"
          networks:
            - name: "{{ network }}"
          security_opts:
            - no-new-privileges:true
          cap_drop: [ALL]
          log_driver: json-file
          log_options:
            max-size: 10m
            max-file: "3"
