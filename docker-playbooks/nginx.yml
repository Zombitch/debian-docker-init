---
- name: Deploy nginx reverse proxy with fail2ban protection
  hosts: docker_hosts
  gather_facts: true
  become: true
  vars:
    nginx_container_name: nginx
    http_port: 80
    https_port: 443
    nginx_log_path: /var/log/nginx
    # Permanent bans (-1) lock out dynamic IPs and grow forever: use incremental bans.
    fail2ban_bantime: 1h
    fail2ban_bantime_max: 4w
    fail2ban_findtime: 10m
    fail2ban_maxretry: 5
    # Add your own admin IP(s) here (space separated) to avoid locking yourself out.
    fail2ban_ignoreip: "127.0.0.1/8 ::1"

  tasks:
    - name: Create nginx volume
      community.docker.docker_volume:
        name: "{{ nginx_volume }}"

    - name: Create docker network
      community.docker.docker_network:
        name: "{{ network }}"

    - name: Create nginx log directory on host
      ansible.builtin.file:
        path: "{{ nginx_log_path }}"
        state: directory
        mode: "0755"

    - name: Run the latest nginx image
      ansible.builtin.include_tasks: includes/deploy_container.yml
      vars:
        svc_name: "{{ nginx_container_name }}"
        svc_image: "{{ nginx_image }}"
        svc_params:
          restart_policy: unless-stopped
          published_ports:
            - "0.0.0.0:{{ https_port }}:443"
            - "0.0.0.0:{{ http_port }}:80"
          volumes:
            - "{{ nginx_volume }}:/etc/nginx"
            - "{{ nginx_log_path }}:/var/log/nginx"
          networks:
            - name: "{{ network }}"
          security_opts:
            - no-new-privileges:true
          healthcheck:
            test: ["CMD-SHELL", "nginx -t || exit 1"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 10s
          memory: 256m
          cpu_shares: 512
          log_driver: json-file
          log_options:
            max-size: 10m
            max-file: "3"

    # ------------------------------------------------------------------
    # Base configuration (written into the volume after first start, which
    # is when Docker populates it from the image).
    # ------------------------------------------------------------------
    - name: Create ACME webroot
      ansible.builtin.file:
        path: "{{ nginx_volume_path }}/www/certbot/.well-known/acme-challenge"
        state: directory
        mode: "0755"

    - name: Remove nginx default site (conflicts with our default_server)
      ansible.builtin.file:
        path: "{{ nginx_volume_path }}/conf.d/default.conf"
        state: absent
      notify: Reload nginx

    - name: Deploy ACME challenge / HTTPS redirect server
      ansible.builtin.template:
        src: acme-redirect.conf.j2
        dest: "{{ nginx_volume_path }}/conf.d/00-acme-redirect.conf"
        mode: "0644"
      notify: Reload nginx

    - name: Deploy shared WebSocket map
      ansible.builtin.template:
        src: websocket-map.conf.j2
        dest: "{{ nginx_volume_path }}/conf.d/00-websocket-map.conf"
        mode: "0644"
      notify: Reload nginx

    - name: Install logrotate, fail2ban and nftables
      ansible.builtin.apt:
        name:
          - logrotate
          - fail2ban
          - nftables
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Make sure nginx log files exist (fail2ban refuses jails on missing logs)
      ansible.builtin.file:
        path: "{{ nginx_log_path }}/{{ item }}"
        state: touch
        mode: "0644"
        access_time: preserve
        modification_time: preserve
      loop:
        - access.log
        - error.log

    - name: Rotate nginx host logs
      ansible.builtin.template:
        src: nginx-logrotate.j2
        dest: /etc/logrotate.d/nginx-docker
        mode: "0644"

    # nginx-http-auth, nginx-limit-req and nginx-botsearch ship with fail2ban.
    - name: Deploy nginx-noscript filter
      ansible.builtin.template:
        src: fail2ban-nginx-noscript.conf.j2
        dest: /etc/fail2ban/filter.d/nginx-noscript.conf
        mode: "0644"
      notify: Reload fail2ban

    - name: Deploy nginx jails
      ansible.builtin.template:
        src: fail2ban-nginx-jails.conf.j2
        dest: /etc/fail2ban/jail.d/nginx.conf
        mode: "0644"
      notify: Reload fail2ban

    - name: Enable and start fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        enabled: true
        state: started

  handlers:
    - name: Reload nginx
      community.docker.docker_container_exec:
        container: "{{ nginx_container_name }}"
        argv: [sh, -c, "nginx -t && nginx -s reload"]
      changed_when: true

    - name: Reload fail2ban
      ansible.builtin.systemd:
        name: fail2ban
        state: reloaded
