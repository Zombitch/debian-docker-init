---
# Usage:
#   ansible-playbook docker-playbooks/nginx-add-host.yml -e domain=app.example.com -e docker_host=keeweb_host:80
# Requires a certificate first: CERTBOT_EMAIL=... ./request-new-certificate.sh app.example.com
- name: Add an nginx HTTPS virtual host proxying to a container
  hosts: docker_hosts
  gather_facts: true
  become: true
  vars:
    nginx_container_name: nginx
    vhost_path: "{{ nginx_volume_path }}/conf.d/{{ domain }}.conf"

  tasks:
    - name: Check required variables
      ansible.builtin.assert:
        that:
          - domain is defined
          - domain is match('^[A-Za-z0-9.-]+$')
          - docker_host is defined
          - docker_host is match('^[A-Za-z0-9_.-]+(:[0-9]+)?$')
        fail_msg: "Set -e domain=<fqdn> -e docker_host=<container_hostname[:port]>"

    - name: Check that the certificate exists
      ansible.builtin.stat:
        path: "{{ nginx_volume_path }}/letsencrypt/live/{{ domain }}/fullchain.pem"
      register: cert

    - name: Fail early without a certificate
      ansible.builtin.fail:
        msg: "No certificate for {{ domain }}. Run: CERTBOT_EMAIL=you@example.com ./request-new-certificate.sh {{ domain }}"
      when: not cert.stat.exists

    - name: Deploy vhost and reload nginx (rolled back if the config is invalid)
      block:
        - name: Write vhost
          ansible.builtin.template:
            src: vhost.conf.j2
            dest: "{{ vhost_path }}"
            mode: "0644"
            backup: true
          register: vhost

        - name: Validate and reload nginx  # noqa: no-handler
          community.docker.docker_container_exec:
            container: "{{ nginx_container_name }}"
            argv: [sh, -c, "nginx -t && nginx -s reload"]
          changed_when: true
          when: vhost is changed
      rescue:
        - name: Restore previous vhost
          ansible.builtin.copy:
            src: "{{ vhost.backup_file }}"
            dest: "{{ vhost_path }}"
            remote_src: true
            mode: "0644"
          when: vhost.backup_file is defined

        - name: Remove the new vhost (there was no previous one)
          ansible.builtin.file:
            path: "{{ vhost_path }}"
            state: absent
          when: vhost.backup_file is not defined

        - name: Abort
          ansible.builtin.fail:
            msg: "nginx rejected the new config for {{ domain }}; previous state restored."
