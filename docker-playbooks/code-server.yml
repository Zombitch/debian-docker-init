---
# Reach it through nginx: -e domain=... -e docker_host=codeserver_host:8443 (WebSocket headers are in the vhost template)
- name: Deploy code-server
  hosts: docker_hosts
  gather_facts: true
  become: true
  vars_prompt:
    - name: pwd
      prompt: code-server password
      private: true
  vars:
    code_server_dir: "{{ data_dir }}/code-server/docker"
    code_server_node_version: "22.14.0"
    code_server_nvm_version: "0.40.1"
    code_server_local_image: mvs/code-server

  tasks:
    - name: Create docker network
      community.docker.docker_network:
        name: "{{ network }}"

    - name: Create code-server volume
      community.docker.docker_volume:
        name: codeserver_data

    - name: Create code-server build folder
      ansible.builtin.file:
        path: "{{ code_server_dir }}"
        state: directory
        mode: "0755"

    - name: Write Dockerfile
      ansible.builtin.template:
        src: code-server.Dockerfile.j2
        dest: "{{ code_server_dir }}/Dockerfile"
        mode: "0644"

    # Layer cache keeps unchanged builds fast; the container is only recreated if the image changed.
    - name: Build image
      community.docker.docker_image_build:
        name: "{{ code_server_local_image }}"
        path: "{{ code_server_dir }}"
        rebuild: always
        pull: true

    - name: Run code-server container
      community.docker.docker_container:
        name: code-server
        image: "{{ code_server_local_image }}"
        pull: never
        hostname: codeserver_host
        state: started
        restart_policy: unless-stopped
        volumes:
          - codeserver_data:/config
        networks:
          - name: "{{ network }}"
        # No no-new-privileges here: the integrated terminal relies on sudo (SUDO_PASSWORD).
        env:
          PUID: "1000"
          PGID: "1000"
          TZ: "{{ timezone }}"
          PASSWORD: "{{ pwd }}"
          SUDO_PASSWORD: "{{ pwd }}"
        log_driver: json-file
        log_options:
          max-size: 10m
          max-file: "3"
      no_log: true
