---
# Reach it through nginx: ansible-playbook docker-playbooks/nginx-add-host.yml -e domain=... -e docker_host=keeweb_host:80
- name: Deploy KeeWeb
  hosts: docker_hosts
  gather_facts: true
  become: true
  vars:
    keeweb_conf_dir: "{{ data_dir }}/keeweb"

  tasks:
    - name: Create docker network
      community.docker.docker_network:
        name: "{{ network }}"

    - name: Create keeweb config folder
      ansible.builtin.file:
        path: "{{ keeweb_conf_dir }}"
        state: directory
        mode: "0755"

    # Mounted over the image's nginx site instead of editing a docker volume on the host.
    - name: Write keeweb nginx site (listen on port 80 inside the container)
      ansible.builtin.template:
        src: keeweb.conf.j2
        dest: "{{ keeweb_conf_dir }}/keeweb.conf"
        mode: "0644"
      register: keeweb_conf

    - name: Run the latest keeweb image
      ansible.builtin.include_tasks: includes/deploy_container.yml
      vars:
        svc_name: keeweb
        svc_image: "{{ keeweb_image }}"
        svc_params:
          hostname: keeweb_host
          restart: "{{ keeweb_conf is changed }}"
          restart_policy: unless-stopped
          volumes:
            - "{{ keeweb_conf_dir }}/keeweb.conf:/etc/nginx/conf.d/keeweb.conf:ro"
          networks:
            - name: "{{ network }}"
          security_opts:
            - no-new-privileges:true
          log_driver: json-file
          log_options:
            max-size: 10m
            max-file: "3"
