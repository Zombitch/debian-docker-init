---
# Mock REST API served from /data/json-server/db.json (create it first; it is chowned to uid 1000).
# The whole directory is mounted (not just the file): json-server writes a temp file and renames it.
- name: Deploy json-server
  hosts: docker_hosts
  gather_facts: false
  become: true
  vars:
    json_server_dir: "{{ data_dir }}/json-server"
    json_server_db: "{{ json_server_dir }}/db.json"
    json_server_host_port: 2350

  tasks:
    - name: Create json-server data folder
      ansible.builtin.file:
        path: "{{ json_server_dir }}"
        state: directory
        owner: "1000"
        group: "1000"
        mode: "0755"

    - name: Check the database file exists
      ansible.builtin.stat:
        path: "{{ json_server_db }}"
      register: db

    - name: Fail without a database file
      ansible.builtin.fail:
        msg: "{{ json_server_db }} not found (create it, e.g. echo '{\"posts\": []}' > {{ json_server_db }})"
      when: not db.stat.exists

    - name: Make the database writable by the container user
      ansible.builtin.file:
        path: "{{ json_server_db }}"
        owner: "1000"
        group: "1000"
        mode: "0644"

    - name: Create docker network
      community.docker.docker_network:
        name: "{{ network }}"

    # The container image is node:lts-alpine; the json-server npm package itself stays on the
    # 0.17 line because json-server 1.x (beta) changed its API and db format.
    - name: Run json-server on the latest Node LTS image
      ansible.builtin.include_tasks: includes/deploy_container.yml
      vars:
        svc_name: json-server
        svc_image: "{{ json_server_node_image }}"
        svc_params:
          hostname: json_server_host
          restart_policy: unless-stopped
          user: "1000:1000"
          command: ["npx", "--yes", "json-server@0.17.4", "--host", "0.0.0.0", "--port", "80", "/data/db.json"]
          published_ports:
            - "{{ bind_address }}:{{ json_server_host_port }}:80"
          volumes:
            - "{{ json_server_dir }}:/data"
          networks:
            - name: "{{ network }}"
          security_opts:
            - no-new-privileges:true
          cap_drop: [ALL]
          log_driver: json-file
          log_options:
            max-size: 10m
            max-file: "3"
